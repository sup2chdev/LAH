<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>LAH — Local Agent Harness</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body data-ds-dark-theme>
    <!-- LAH_ICON_SYMBOLS -->
    <div class="window-bar"><span>Local Agent Harness</span></div>
    <div class="app-shell">
      <aside class="sidebar" data-i18n-aria="sessionsAria">
        <div class="brand"><span class="brand-name">LAH</span><span class="brand-tag">LOCAL AGENT HARNESS</span></div>
        <button class="button new-session" id="new-session" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-new-chat"/></svg><span data-i18n="newSession"></span></button>
        <button class="sidebar-action" id="sidebar-tools" type="button" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#icon-browse"/></svg><span data-i18n="availableTools"></span></button>
        <div class="sidebar-label" data-i18n="workspace"></div>
        <button id="workspace" class="workspace-button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg><span class="workspace-copy"><span id="workspace-name"></span><span id="workspace-path"></span></span></button>
        <nav id="session-list" class="session-list" data-i18n-aria="historyAria"></nav>
        <div class="sidebar-bottom">
          <div class="read-only-note"><span class="status-dot" aria-hidden="true"></span><span data-i18n="localOnly"></span></div>
          <button id="open-settings" class="sidebar-action" type="button" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg><span data-i18n="settings"></span><span id="version"></span></button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="session-heading"><h1 id="session-title"></h1></div>
          <button id="theme-toggle" class="icon-button has-tooltip" type="button" data-i18n-aria="lightTheme"><svg class="icon" aria-hidden="true"><use id="theme-icon" href="#icon-light"/></svg><span id="theme-tooltip" class="tooltip" role="tooltip" data-i18n="lightTheme"></span></button>
        </header>
        <section class="conversation" id="conversation" data-i18n-aria="conversationAria">
          <div class="empty-state" id="empty-state">
            <div class="hero-identity"><svg class="hero-icon" aria-hidden="true"><use href="#icon-agent"/></svg><h2 data-i18n="emptyTitle"></h2><span class="hero-stage" data-i18n="stage"></span></div>
            <div class="setup-steps">
              <button class="setup-step" id="setup-workspace" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg><span id="setup-workspace-label" data-i18n="pickFolder"></span><svg class="icon small" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
              <span class="setup-mode"><svg class="icon" aria-hidden="true"><use href="#icon-agent"/></svg><span data-i18n="localMode"></span></span>
            </div>
          </div>
          <div id="messages" class="messages" aria-live="polite" aria-relevant="additions"></div>
          <div id="working-indicator" class="working-indicator" hidden><span class="working-dots" aria-hidden="true">···</span><span data-i18n="working"></span></div>
          <details class="tool-trace" id="tool-trace" hidden><summary><span data-i18n="toolTrace"></span><span id="tool-count" class="trace-count"></span></summary><div id="tool-events"></div></details>
        </section>
        <div class="composer-region">
          <div class="notice" id="notice" role="alert" hidden></div>
          <form class="composer" id="composer">
            <textarea id="message-input" rows="2" data-i18n-placeholder="messagePlaceholder" data-i18n-aria="messageAria" maxlength="32000"></textarea>
            <div class="composer-footer">
              <button id="composer-add" class="add-button has-tooltip" type="button" popovertarget="composer-menu" data-i18n-aria="quickActions"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg><span class="tooltip" role="tooltip" data-i18n="quickActions"></span></button>
              <span class="composer-mode"><svg class="icon" aria-hidden="true"><use href="#icon-shield"/></svg><span data-i18n="readOnly"></span></span>
              <button id="model-status" class="model-status" type="button" aria-haspopup="dialog"><span id="model-status-label"></span><svg class="icon small" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
              <button id="send" class="send-button has-tooltip" type="submit" data-i18n-aria="send"><svg class="icon" aria-hidden="true"><use href="#icon-send"/></svg><span class="tooltip" role="tooltip" data-i18n="send"></span></button>
              <button id="stop" class="send-button has-tooltip" type="button" data-i18n-aria="stop" hidden><svg class="icon" aria-hidden="true"><use href="#icon-stop"/></svg><span class="tooltip" role="tooltip" data-i18n="stop"></span></button>
            </div>
          </form>
          <div class="composer-caption"><span id="composer-hint" aria-live="polite"></span><button id="tools-toggle" class="text-button" type="button" aria-haspopup="dialog" data-i18n="availableTools"></button></div>
        </div>
      </main>
    </div>
    <div id="composer-menu" class="composer-menu" popover="auto" data-i18n-aria="quickActions">
      <div class="menu-label" data-i18n="quickActions"></div>
      <button type="button" data-suggestion="suggestionStructure"><svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg><span data-suggestion-label="suggestionStructureLabel"></span></button>
      <button type="button" data-suggestion="suggestionSearch"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><span data-suggestion-label="suggestionSearchLabel"></span></button>
      <button type="button" data-suggestion="suggestionRead"><svg class="icon" aria-hidden="true"><use href="#icon-browse"/></svg><span data-suggestion-label="suggestionReadLabel"></span></button>
      <div class="menu-label" data-i18n="settings"></div>
      <button id="menu-model" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-model"/></svg><span data-i18n="modelSettings"></span></button>
      <button id="menu-tools" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-browse"/></svg><span data-i18n="availableTools"></span></button>
    </div>
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" class="settings-form">
        <header class="dialog-header"><h2 id="settings-title" data-i18n="settings"></h2><button id="close-settings" class="icon-button" type="button" data-i18n-aria="closeSettings"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></header>
        <div class="settings-layout">
          <nav class="settings-nav" data-i18n-aria="settings">
            <button id="settings-general-tab" class="settings-nav-item" type="button" data-settings-section="general"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg><span data-i18n="generalSettings"></span></button>
            <button id="settings-models-tab" class="settings-nav-item" type="button" data-settings-section="models"><svg class="icon" aria-hidden="true"><use href="#icon-model"/></svg><span data-i18n="modelsSettings"></span></button>
            <button id="settings-tools-tab" class="settings-nav-item" type="button" data-settings-section="tools"><svg class="icon" aria-hidden="true"><use href="#icon-browse"/></svg><span data-i18n="toolsSettings"></span></button>
          </nav>
          <div class="settings-content">
            <section id="settings-general" class="settings-page">
              <h3 data-i18n="generalSettings"></h3>
              <div class="settings-row"><div><span class="field-label" data-i18n="accessMode"></span><p class="settings-detail" data-i18n="readOnlyHelp"></p></div><span class="setting-value" data-i18n="readOnly"></span></div>
              <div class="appearance"><span class="field-label" data-i18n="appearance"></span><div class="theme-choices"><button class="theme-choice" type="button" data-theme-choice="light"><svg class="icon" aria-hidden="true"><use href="#icon-light"/></svg><span data-i18n="lightTheme"></span></button><button class="theme-choice" type="button" data-theme-choice="dark"><svg class="icon" aria-hidden="true"><use href="#icon-dark"/></svg><span data-i18n="darkTheme"></span></button></div></div>
              <div class="settings-row"><div><span class="field-label" data-i18n="workspace"></span><p id="settings-workspace-path" class="settings-detail"></p></div><button id="settings-workspace" class="button" type="button" data-i18n="pickFolder"></button></div>
              <p class="settings-limit" data-i18n="themeHelp"></p>
            </section>
            <section id="settings-models" class="settings-page" hidden>
              <h3 data-i18n="modelsSettings"></h3>
              <p class="dialog-description" data-i18n="settingsDescription"></p>
              <label class="field"><span data-i18n="endpoint"></span><input id="endpoint-input" type="url" required spellcheck="false" placeholder="http://127.0.0.1:1234/v1"><small data-i18n="endpointHelp"></small></label>
              <div class="model-field"><label class="field"><span data-i18n="modelId"></span><input id="model-input" list="models-list" spellcheck="false" data-i18n-placeholder="modelPlaceholder"><datalist id="models-list"></datalist></label><button id="discover-models" class="button" type="button" data-i18n="discoverModels"></button></div>
              <p class="field-status" id="discovery-status" aria-live="polite"></p>
              <div class="field-row"><label class="field"><span data-i18n="contextWindow"></span><input id="context-input" type="number" min="1024" max="1048576" step="1" required><small data-i18n="contextHelp"></small></label><label class="field"><span data-i18n="maxTokens"></span><input id="max-tokens-input" type="number" min="1" max="1048575" step="1" required><small data-i18n="maxTokensHelp"></small></label></div>
              <p class="settings-limit" data-i18n="settingsLimit"></p>
              <p class="form-error" id="settings-error" role="alert" hidden></p>
            </section>
            <section id="settings-tools" class="settings-page" hidden><h3 data-i18n="availableTools"></h3><p class="dialog-description" data-i18n="toolsHelp"></p><div id="tools-panel" class="tools-panel"></div></section>
          </div>
        </div>
        <footer class="dialog-footer" id="settings-footer" hidden><button id="cancel-settings" class="button" type="button" data-i18n="cancel"></button><button id="save-settings" class="button primary" type="submit" data-i18n="save"></button></footer>
      </form>
    </dialog>
  </body>
</html>
